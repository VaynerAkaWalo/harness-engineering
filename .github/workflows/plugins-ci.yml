name: Plugins CI

on:
  push:
    paths:
      - 'opencode/plugins/**'
  pull_request:
    paths:
      - 'opencode/plugins/**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: opencode/plugins
        run: bun install

      - name: Typecheck
        working-directory: opencode/plugins
        run: bun run typecheck

      - name: Test
        working-directory: opencode/plugins
        run: bun run test
